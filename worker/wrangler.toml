name = "contortion-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# D1 binding — fill in database_id after running:
#   pnpm wrangler d1 create contortion
[[d1_databases]]
binding = "DB"
database_name = "contortion"
database_id = "6141ecbb-a78c-49ff-9cf8-1cbb6a3cbe9c"

[vars]
ALLOWED_ORIGINS = "https://contortion.rikasun.com,http://localhost:5173"

# Secrets (set via `pnpm wrangler secret put <NAME>`):
#   PASSWORD              — your shared history password
#   TOKEN_SIGNING_KEY     — random 32+ byte string for signing unlock tokens
